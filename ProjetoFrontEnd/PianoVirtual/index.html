<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Piano Virtual</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Piano Virtual </h1>
    <br>
    <br>
    <br>

    <div class="piano">

        <div class="tecla branca" data-note="C">A</div>
        <div class="tecla preta" data-note="C#"></div>

        <div class="tecla branca" data-note="D">S</div>
        <div class="tecla preta" data-note="D#"></div>

        <div class="tecla branca" data-note="E">D</div>

        <div class="tecla branca" data-note="F">F</div>
        <div class="tecla preta" data-note="F#"></div>

        <div class="tecla branca" data-note="G">G</div>
        <div class="tecla preta" data-note="G#"></div>

        <div class="tecla branca" data-note="A">H</div>
        <div class="tecla preta" data-note="A#"></div>

        <div class="tecla branca" data-note="B">J</div>

    </div>

    <script src="piano.js"></script>

</body>

</html>
