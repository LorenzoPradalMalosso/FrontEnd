<section class="listar-vagas" style="margin-bottom: 200px;">
  <!-- property data binding ngfor -->
   <!-- nova ferramenta @for -->
  @for (vaga of vagas; track vagas){
    <div>
      <div class="card">
        <img src="https://imgs.search.brave.com/Dz_RnrlRJlATdFLqaSUgBDRtlaWbhwhClMawzLkrb2Q/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9yYXZl/bC5jb20uYnIvYXNz/ZXRzL2ltYWdlcy9y/YXZlbC1zb2x1dGlv/bnMtNi53ZWJw" alt="Vaga">
        <div class="card-body">
          <h5 class="card-title">Código da Vaga: {{vaga.id}}</h5>
          <h5 class="card-title">Vaga: {{vaga.nome}}</h5>
          <p class="card-text">Descrição da Vaga: {{vaga.descricao}}</p>
          <p class="card-text">Salário: R$ {{vaga.salario}}</p>

        </div>
      </div>
    </div>
  }
</section>
