<div class="row">
  <div class="col-12">
    <h2>Contato</h2>

    <form (ngSubmit)="salvarDados()" class="mb-4">
      <div class="mb-3">
        <label class="form-label">Nome</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="nome"
          name="nome"
          placeholder="Digite seu nome"
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          [(ngModel)]="email"
          name="email"
          placeholder="Digite seu email"
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Mensagem</label>
        <textarea
          class="form-control"
          [(ngModel)]="mensagem"
          name="mensagem"
          rows="4"
          placeholder="Escreva sua mensagem"
        ></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Enviar</button>
    </form>

    <div>
      <h3>Dados salvos</h3>
      <p>{{ dadosSalvos }}</p>
    </div>
  </div>
</div>
